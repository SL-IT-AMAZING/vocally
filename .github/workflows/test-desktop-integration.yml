name: Test Desktop Integration

on:
  # Live Groq API calls require a configured repository secret.
  workflow_dispatch:

jobs:
  integration-tests:
    name: Desktop Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npm run build -- --filter=desktop^...

      - name: Create empty .env file since secrets are injected via env vars
        run: |
          echo '' > apps/desktop/test/helpers/.env

      - name: Run desktop integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run test:integration --workspace=desktop
